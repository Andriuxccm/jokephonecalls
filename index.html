<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notch call simulation</title>
<style>
  :root { --green:#34c759; --red:#ff453a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: #fff; overflow: hidden;
    background: #14122e center / cover no-repeat;
  }
  body.empty { background: radial-gradient(120% 90% at 20% 0%, #5b6cf0 0%, #3a2c8f 45%, #14122e 100%); }
  .notch {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 190px; height: 34px; background: #000; overflow: hidden;
    border-radius: 0 0 14px 14px;
    transition: width .55s cubic-bezier(.34,1.45,.5,1), height .55s cubic-bezier(.34,1.45,.5,1), border-radius .55s cubic-bezier(.34,1.45,.5,1);
  }
  .notch.open { width: 392px; height: 156px; border-radius: 0 0 28px 28px; }
  .card { position: absolute; inset: 0; padding: 0 18px; opacity: 0; filter: blur(9px); transform: scale(.88); transform-origin: top;
          transition: opacity .15s ease-in, filter .15s ease-in, transform .15s ease-in; }
  .notch.open .card { opacity: 1; filter: none; transform: none; transition: opacity .35s ease-out .16s, filter .35s ease-out .16s, transform .45s cubic-bezier(.34,1.4,.5,1) .12s; }
  .top { height: 34px; display:flex; align-items:center; justify-content:space-between; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.55); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(#9a9aa0,#6a6a70); display:grid; place-items:center; font-size: 12px; font-weight: 700; color: #fff; }
  .main { display:flex; align-items:center; justify-content:space-between; height: 108px; }
  .who { min-width: 0; }
  .who b { display:block; font-size: 19px; font-weight: 650; outline: none; max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; }
  .who b:focus { text-overflow: clip; }
  .who span { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.5); }
  .btns { display:flex; gap: 14px; }
  button.round { width: 50px; height: 50px; border: 0; border-radius: 50%; display:grid; place-items:center; cursor: pointer; transition: transform .15s; }
  button.round:active { transform: scale(.9); }
  .decline { background: var(--red); } .decline svg { transform: rotate(135deg); }
  .accept { background: var(--green); }
  .ring { animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52,199,89,.55); } 100% { box-shadow: 0 0 0 14px rgba(52,199,89,0); } }
  .timer { font-variant-numeric: tabular-nums; font-weight: 650; color: var(--green) !important; }

  .setup { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(340px, calc(100% - 32px)); padding: 18px; border-radius: 20px;
           background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(24px); display: grid; gap: 10px;
           transition: opacity .3s, transform .3s; }
  .setup.gone { opacity: 0; transform: translate(-50%,-46%) scale(.96); pointer-events: none; }
  .setup input[type=text] { padding: 11px 13px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.1); color: #fff; font: inherit; }
  .setup input::placeholder { color: rgba(255,255,255,.5); }
  .setup button { padding: 11px; border: 0; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer; }
  .setup .pick { background: rgba(255,255,255,.14); color: #fff; }
  .setup .go { background: #fff; color: #111; }
  .setup .go:disabled { opacity: .4; cursor: default; }
  body.drag::after { content: "Drop the photo"; position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.45); font-size: 22px; font-weight: 700; }
</style>
</head>
<body class="empty">
  <div class="notch" id="notch">
    <div class="card">
      <div class="top"><div class="avatar" id="av">?</div><span>iPhone</span></div>
      <div class="main">
        <div class="who"><b id="name">Name</b><span id="sub">iPhone</span></div>
        <div class="btns" id="btns"></div>
      </div>
    </div>
  </div>

  <div class="setup" id="setup">
    <input type="text" id="nameIn" placeholder="Name" maxlength="30" autocomplete="off">
    <button class="pick" id="photoBtn">Choose photo</button>
    <button class="go" id="go" disabled>Start</button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>

<script>
  const $ = id => document.getElementById(id);
  const notch = $("notch"), nameEl = $("name");
  let timer = null, closeT = null;
  const PH = '<svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>';
  const initials = n => n.trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase() || "?";
  const clock = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  const setBtns = html => { $("btns").innerHTML = html; };
  const refreshAvatar = () => { $("av").textContent = initials(nameEl.textContent); };

  function ring() {
    clearInterval(timer); clearTimeout(closeT);
    $("sub").className = ""; $("sub").textContent = "iPhone"; refreshAvatar();
    setBtns('<button class="round decline" id="decline">' + PH + '</button><button class="round accept ring" id="accept">' + PH + '</button>');
    notch.classList.add("open");
    $("decline").onclick = () => end("Declined");
    $("accept").onclick = answer;
    closeT = setTimeout(() => end("Missed"), 60000);
  }
  function answer() {
    clearTimeout(closeT); let s = 0;
    $("sub").className = "timer"; $("sub").textContent = "0:00";
    setBtns('<button class="round decline" id="hang">' + PH + '</button>');
    timer = setInterval(() => { s++; $("sub").textContent = clock(s); }, 1000);
    $("hang").onclick = () => end("Call ended · " + clock(s));
  }
  function end(msg) {
    clearInterval(timer); clearTimeout(closeT);
    $("sub").className = ""; $("sub").textContent = msg; setBtns("");
    closeT = setTimeout(() => notch.classList.remove("open"), 1400);
  }

  // name + photo are set once, then the panel goes away
  let hasPhoto = false, started = false;
  const check = () => { $("go").disabled = !(nameIn.value.trim() && hasPhoto); };
  const nameIn = $("nameIn");
  nameIn.addEventListener("input", check);
  nameIn.addEventListener("keydown", e => { if (e.key === "Enter" && !$("go").disabled) $("go").click(); });
  function setPhoto(f) {
    if (!f || !f.type.startsWith("image/")) return;
    document.body.style.backgroundImage = "url(" + URL.createObjectURL(f) + ")";
    document.body.classList.remove("empty");
    hasPhoto = true; $("photoBtn").textContent = "Photo set ✓"; check();
  }
  $("photoBtn").onclick = () => $("file").click();
  $("file").onchange = e => setPhoto(e.target.files[0]);
  $("go").onclick = () => {
    nameEl.textContent = nameIn.value.trim(); started = true;
    $("setup").classList.add("gone");
    setTimeout(ring, 600);
  };
  addEventListener("dragover", e => { if (!started) { e.preventDefault(); document.body.classList.add("drag"); } });
  addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("drag"); });
  addEventListener("drop", e => { e.preventDefault(); document.body.classList.remove("drag"); if (!started) setPhoto(e.dataTransfer.files[0]); });
  addEventListener("paste", e => { if (!started) setPhoto([...(e.clipboardData?.files || [])][0]); });
  // after the call is over, a click on the screen rings again
  addEventListener("click", e => { if (started && !notch.classList.contains("open") && !e.target.closest(".notch")) ring(); });
</script>
</body>
</html>
